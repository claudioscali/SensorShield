version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sensorshield_db
    env_file:
      - .env  
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: sensorshield_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    env_file:
      - .env  
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  postgres_data: